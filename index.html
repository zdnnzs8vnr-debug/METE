const LANGS=[["en","English"],["it","Italiano"],["fr","Français"],["de","Deutsch"],["es","Español"],["pt","Português"],["ru","Русский"],["zh","中文"],["ja","日本語"],["ko","한국어"]];
const sel=document.getElementById('lang');
LANGS.forEach(([c,n])=>{const o=document.createElement('option');o.value=c;o.textContent=n;sel.appendChild(o)});
function T(k){return (I18N[document.documentElement.lang]||I18N.en)[k]||I18N.en[k]||k}
function setLang(l){
  if(!I18N[l])l='en';
  document.documentElement.lang=l;const t=I18N[l];
  document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(t[k]!=null)el.textContent=t[k]});
  const g=document.querySelector('h1 .g'); if(g) g.setAttribute('data-t',g.textContent);
  document.title=t.title;
  document.querySelectorAll('[data-ca]').forEach(e=>e.textContent=CA||t.tba);
  const d=new Date(PUBLISHED).toLocaleDateString(l,{day:'2-digit',month:'short',year:'numeric'});
  const p1=document.getElementById('pub'); if(p1)p1.textContent=d;
  const p2=document.getElementById('pub2'); if(p2)p2.textContent=d;
  sel.value=l; try{localStorage.setItem('lang',l)}catch(e){}
}
sel.onchange=()=>setLang(sel.value);
setLang((()=>{try{return localStorage.getItem('lang')}catch(e){return null}})()||(navigator.language||'en').slice(0,2));
document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{
  if(!CA)return;navigator.clipboard.writeText(CA);
  const t=b.textContent;b.textContent=T('copied');
  document.getElementById('toast').textContent=T('copied');
  document.getElementById('toast').classList.add('on');
  setTimeout(()=>{b.textContent=T('copy');document.getElementById('toast').classList.remove('on')},1400);
});
const pages=[...document.querySelectorAll('.page')];
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target)}}),{rootMargin:'0px 0px -6% 0px'}):null;
function show(){
  const id=(location.hash||'#home').slice(1);
  const t=document.getElementById(id)||document.getElementById('home');
  pages.forEach(p=>p.classList.toggle('on',p===t));
  document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+t.id));
  t.querySelectorAll('.rv').forEach(el=>{el.classList.remove('in');if(io)io.observe(el);else el.classList.add('in')});
  setTimeout(()=>t.querySelectorAll('.rv:not(.in)').forEach(el=>el.classList.add('in')),1500);
  window.scrollTo({top:0,behavior:'smooth'});
}
addEventListener('hashchange',show);
try{show()}catch(e){document.documentElement.classList.remove('js')}
const items=['SOLANA','NO TAX','1,000,000,000','TUESDAY 15:30 UK','LAUNCH','TELEGRAM','X','BE EARLY','THE FIRST HOUR IS THE EDGE'];
document.getElementById('tk').innerHTML=[...items,...items].map(i=>'<span>'+i+'</span><b>•</b>').join('');
const target=new Date(LAUNCH).getTime();
function tick(){const p=n=>String(n).padStart(2,'0');let d=target-Date.now();
  if(d<0){['d','h','m','s'].forEach(i=>document.getElementById(i).textContent='00');document.getElementById('cdt').textContent='LIVE';return}
  const s=Math.floor(d/1000);
  document.getElementById('d').textContent=p(Math.floor(s/86400));
  document.getElementById('h').textContent=p(Math.floor(s/3600)%24);
  document.getElementById('m').textContent=p(Math.floor(s/60)%60);
  document.getElementById('s').textContent=p(s%60);
  document.getElementById('cdt').textContent=p(Math.floor(s/86400))+'d '+p(Math.floor(s/3600)%24)+':'+p(Math.floor(s/60)%60)+':'+p(s%60);
}
tick();setInterval(tick,1000);
const cv=document.getElementById('grid'),cx=cv.getContext('2d');let W,H,pts=[];
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;pts=[];for(let i=0;i<Math.min(70,Math.floor(W/22));i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22})}
rs();addEventListener('resize',rs);
(function loop(){cx.clearRect(0,0,W,H);cx.fillStyle='rgba(0,255,133,.45)';
 for(const p of pts){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  for(const q of pts){const dx=p.x-q.x,dy=p.y-q.y,d2=dx*dx+dy*dy;if(d2<17000){cx.strokeStyle='rgba(0,255,133,'+(0.10*(1-d2/17000))+')';cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(q.x,q.y);cx.stroke()}}
  cx.beginPath();cx.arc(p.x,p.y,1.4,0,7);cx.fill()}
 requestAnimationFrame(loop)})();
addEventListener('scroll',()=>{const h=document.documentElement;const sc=(h.scrollTop)/(h.scrollHeight-h.clientHeight)*100;document.getElementById('bar').style.width=sc+'%'},{passive:true});
document.querySelectorAll('.wcard').forEach(c=>c.addEventListener('mousemove',e=>{const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')}));
